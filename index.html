<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Pages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1 {
            color: brown;
        }

        :root {
            --particle-wine: #eb3182;
            --particle-green: #0f51b3;
            --particle-ivory: #a00fd1;
        }

        body {
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .particle-layer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 9999;
        }

        .particle {
            position: absolute;
            left: 0;
            top: 0;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform, opacity;
        }

        /* ユーザーがアニメーションを減らす設定にしている場合、パーティクルを表示しない */
        @media (prefers-reduced-motion: reduce) {
            .particle-layer {
                display: none;
            }
        }
    </style>
</head>

<body>
    <h1>公開用リポジトリ</h1>

    <div class="particle-layer" aria-hidden="true"></div>


    <script>
        const particleLayer = document.querySelector('.particle-layer');
        const colors = [
            'var(--particle-wine)',
            'var(--particle-green)',
            'var(--particle-ivory)',
        ];
        const maxParticles = 70;
        let lastParticleTime = 0;

        function createParticle(x, y) {
            if (particleLayer.childElementCount >= maxParticles) {
                particleLayer.firstElementChild?.remove();
            }

            const particle = document.createElement('span');
            const size = 10 + Math.random() * 38;
            const angle = Math.random() * Math.PI * 2;
            const distance = 35 + Math.random() * 115;
            const duration = 1800 + Math.random() * 1400;
            const color = colors[Math.floor(Math.random() * colors.length)];

            particle.className = 'particle';
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.backgroundColor = `color-mix(in srgb, ${color} ${Math.round((0.55 + Math.random() * 0.3) * 100)}%, transparent)`;
            particle.style.left = `${x - size / 2}px`;
            particle.style.top = `${y - size / 2}px`;
            particleLayer.append(particle);

            const driftX = Math.cos(angle) * distance;
            const driftY = Math.sin(angle) * distance;
            const animation = particle.animate(
                [
                    { transform: 'translate(0, 0) scale(1)', opacity: 0.9 },
                    { transform: `translate(${driftX}px, ${driftY}px) scale(0.15)`, opacity: 0 },
                ],
                { duration, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' },
            );

            animation.onfinish = () => particle.remove();
        }

        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.addEventListener('pointermove', (event) => {
                const now = performance.now();
                if (now - lastParticleTime < 18) return;

                lastParticleTime = now;
                createParticle(event.clientX, event.clientY);
            });
        }
    </script>
</body>

</html>
